  </text>
  <rect x="520" y="430" width="230" height="62" rx="31" fill="url(#accent)" />
  <text x="635" y="470" fill="#0f172a" font-family="Aptos, Segoe UI, sans-serif" font-size="24" font-weight="700" text-anchor="middle">
    React  CSS  SEO
